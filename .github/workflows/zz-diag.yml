name: zz-diag
on: pull_request
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: dump vars
        env:
          ALLVARS: ${{ toJSON(vars) }}
        run: |
          echo "=====VARS_BEGIN====="
          echo "$ALLVARS"
          echo "=====VARS_END====="
